[project]
name = "backend"
version = "0.1.0"
description = "RailSync-AI Automated Block Planning System (ABPS) Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "ortools>=9.9",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
